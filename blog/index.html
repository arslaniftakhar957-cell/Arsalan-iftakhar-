<!DOCTYPE html>
<html><head><title>Blog - ScoreLab Academy</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
</head><body style="font-family:sans-serif;max-width:800px;margin:20px auto;padding:20px;line-height:1.6;">
<a href="../index.html">← Home</a>
<h1>📚 Latest Blog Post Categories</h1>
<div id="cats" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0;"></div>
<div id="posts"></div>
<script>
const allCats = ["YouTube Automation","Online Earning","IELTS Preparation","AI Prompts","Freelancing","Digital Marketing","Lifestyle & Travel"];
const colors = ["#2563eb","#7c3aed","#0d9488","#db2777","#ea580c","#16a34a","#4f46e5"];
fetch('posts.json').then(r=>r.json()).then(posts=>{
  let cHtml = "";
  allCats.forEach((cat,i)=>{
    cHtml += `<a href="#" onclick="showCat('${cat}');return false;" style="background:${colors[i]};color:#fff;padding:20px;border-radius:12px;text-decoration:none;text-align:center;font-weight:bold;">${i+1}. ${cat}</a>`;
  });
  document.getElementById('cats').innerHTML = cHtml;
  window.showCat = function(cat){
    let f = posts.filter(p=>p.category===cat);
    let h = `<h2>${cat}</h2>`;
    if(f.length==0) h += `<p>New post coming soon...</p><a href="coming-soon.html">Read coming soon</a>`;
    else f.forEach(p=>{ h += `<p><a href="${p.file}">${p.title}</a></p>`; });
    document.getElementById('posts').innerHTML = h;
  };
});
</script>
</body></html>
