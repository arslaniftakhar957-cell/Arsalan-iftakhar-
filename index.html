<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScoreLab AI Tools</title>
<style>
body{font-family:system-ui;background:#f0f4ff;margin:0;padding:16px}
h1{color:#1d4ed8;text-align:center;margin:10px 0}
.card{background:#fff;padding:18px;border-radius:16px;box-shadow:0 4px 14px rgba(0,0,0,.08);margin-bottom:14px}
button{background:#2563eb;color:#fff;border:0;padding:13px;border-radius:10px;width:100%;font-size:16px;margin-top:8px;font-weight:600;cursor:pointer}
.copy{background:#16a34a}
input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:10px;box-sizing:border-box;font-size:15px}
pre{background:#f8fafc;padding:14px;border-radius:10px;white-space:pre-wrap;line-height:1.6;border:1px solid #e2e8f0}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tab{flex:1;text-align:center;padding:11px;background:#e2e8f0;border-radius:10px;cursor:pointer;font-weight:600}.active{background:#2563eb;color:#fff}
.premium{border:2px solid #2563eb;background:#eff6ff}
</style>
</head>
<body>
<h1>ScoreLab AI Tools</h1>
<div class="tabs"><div class="tab active" id="tab0">Script Writer</div><div class="tab" id="tab1">Thumbnail</div><div class="tab" id="tab2">SEO Kit</div></div>

<div class="card" id="t0">
<h3>YouTube Script Writer (Free Pro)</h3>
<input id="topic" placeholder="Topic likho: iPhone 17 review">
<button id="b0">Generate Viral Script</button>
<pre id="o0">Yahan best script aayega...</pre>
<button class="copy" onclick="navigator.clipboard.writeText(document.getElementById('o0').innerText);alert('Copied!')">Copy Script</button>
</div>

<div class="card" id="t1" style="display:none">
<h3>Thumbnail Ideas (Free Pro)</h3>
<input id="ttopic" placeholder="Topic likho: Biryani Challenge">
<button id="b1">Generate 10 Viral Ideas</button>
<pre id="o1">Yahan ideas aayenge...</pre>
<button class="copy" onclick="navigator.clipboard.writeText(document.getElementById('o1').innerText);alert('Copied!')">Copy Ideas</button>
</div>

<div class="card" id="t2" style="display:none">
<h3>YouTube SEO Kit (Free Pro)</h3>
<input id="htopic" placeholder="Topic likho: cricket highlights">
<button id="b2">Generate Title + Tags</button>
<pre id="o2">Yahan SEO aayega...</pre>
<button class="copy" onclick="navigator.clipboard.writeText(document.getElementById('o2').innerText);alert('Copied!')">Copy SEO</button>
</div>

<div class="card premium">
<h3>🔥 Premium Kits - Level Up Karo</h3>
<p>Free tools pasand aaye? Ab pro bano:</p>
<button onclick="window.open('https://arslaniftakhar.gumroad.com/l/500-prompts-grow-study-earn','_blank')">1. Get 500 Prompts - Grow Study Earn</button>
<button onclick="window.open('https://arslaniftakhar.gumroad.com/l/youtube-automation-kit','_blank')" style="background:#7c3aed">2. Get YouTube Automation Kit</button>
<button onclick="window.open('https://arslaniftakhar.gumroad.com/l/ielts-band7-kit','_blank')" style="background:#0f766e">3. Get IELTS Band 7 Kit</button>
</div>

<script>
function show(n){for(let i=0;i<3;i++){document.getElementById('t'+i).style.display=i===n?'block':'none';document.getElementById('tab'+i).className='tab'+(i===n?' active':'')}}
tab0.onclick=()=>show(0);tab1.onclick=()=>show(1);tab2.onclick=()=>show(2);

b0.onclick=()=>{
let t=topic.value.trim()||"My Video";
o0.innerText=`VIRAL TITLE: ${t} - 5 Things No One Tells You! (2026)\n\n[0-15s HOOK]\nDosto ruk jao! Agar aap ${t} ke baare me ye video skip kar doge to aapko baad me pachtawa hoga. Kyunki number 4 wala point sabse important hai.\n\n[INTRO]\nAssalam-o-Alaikum! Welcome to ScoreLab AI Tools. Aaj hum baat karenge ${t} ki complete detail me.\n\n[MAIN CONTENT]\nPehli baat: ${t} me sabse bari ghalti jo 90% log karte hain, wo hai...\nDusri baat: Mene khud ${t} ko test kiya aur mujhe ye 3 faide mile:\n1. Time saving trick\n2. Money saving hack\n3. Pro result without effort\n\nTeesri baat: Agar aap beginner hain to ${t} ko is tarike se start karen...\n\n[ENGAGEMENT]\nComment me batao, kya aapne pehle kabhi ${t} try kiya?\n\n[CTA]\nVideo achi lagi to LIKE karo, apne dost ke sath SHARE karo, aur ScoreLab ko SUBSCRIBE karna mat bhoolna taake aisi videos milti rahen.`;
};

b1.onclick=()=>{
let t=ttopic.value.trim()||"Video"; let U=t.toUpperCase();
o1.innerText=`COPY-PASTE THUMBNAIL TEXT IDEAS for "${t}":\n\n1. ${U} 😱\n2. I Tried ${t}!\n3. ${t} Gone Wrong ❌\n4. 3 Secrets of ${t}\n5. STOP! Don't Do ${t}\n6. ${t} in 2026?!\n7. $0 vs $100 ${t}\n8. Why ${t} is Viral?\n9. Real Truth of ${t}\n10. ${t} Challenge Accepted!`;
};

b2.onclick=()=>{
let t=htopic.value.trim()||"my video";
let tag=t.toLowerCase().replace(/[^a-z0-9 ]/g,'').trim().replace(/ +/g,'');
o2.innerText=`OPTIMIZED TITLE:\n1. ${t} | Best ${t} Video in 2026 You Must Watch!\n2. I Tried ${t} - Here's What Happened!\n\nDESCRIPTION:\nIn today's video, we talk about ${t} in complete detail.\nSubscribe to ScoreLab AI Tools for more.\n\nHASHTAGS:\n#${tag} #${tag}2026 #viralvideo #trendingpakistan #scorelabaitools`;
};
show(0);
</script>
</body>
</html>
