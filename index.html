<script>
function show(n){for(let i=0;i<7;i++){document.getElementById('t'+i).style.display=i===n?'block':'none';document.getElementById('tab'+i).className='tab'+(i===n?' active':'')}}
for(let i=0;i<7;i++){document.getElementById('tab'+i).onclick=()=>show(i)}

async function callGemini(prompt, type, outputEl, btn){
  const oldText = btn.innerText;
  btn.innerText = "AI Soch Raha Hai...";
  btn.disabled = true;
  outputEl.innerText = "Please wait... Gemini AI likh raha hai...";
  try{
    const res = await fetch('/api/gemini', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt, type })
    });
    const data = await res.json();
    outputEl.innerText = data.result || "Error aaya, dobara try karo.";
    return data.result;
  }catch(e){
    outputEl.innerText = "Error: " + e.message;
  }
  btn.innerText = oldText;
  btn.disabled = false;
}
