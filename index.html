<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScoreLab AI Tools</title>
<style>
body{font-family:system-ui;background:#f8fafc;margin:0;padding:16px;color:#111}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
h1{color:#1d4ed8;text-align:center} button{background:#2563eb;color:#fff;border:0;padding:12px 16px;border-radius:10px;width:100%;font-size:16px;margin-top:10px;cursor:pointer}
textarea,input{width:100%;padding:12px;border-radius:10px;border:1px solid #cbd5e1;font-size:15px;box-sizing:border-box}
pre{background:#f1f5f9;padding:12px;border-radius:10px;white-space:pre-wrap;min-height:60px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;text-align:center;padding:10px;background:#e2e8f0;border-radius:10px;cursor:pointer;font-weight:600}
.active{background:#2563eb;color:#fff}
</style>
</head>
<body>
<h1>ScoreLab AI Tools</h1>

<div class="tabs">
<div class="tab active" id="tab0">Script</div>
<div class="tab" id="tab1">Thumbnail</div>
<div class="tab" id="tab2">Hashtags</div>
</div>

<div class="card" id="t0">
<h3>YouTube Script Writer</h3>
<input id="topic" placeholder="Video topic likho... ex: iPhone 17 review">
<button id="b0">Generate Script</button>
<pre id="outScript">Yahan script aayega...</pre>
</div>

<div class="card" id="t1" style="display:none">
<h3>YouTube Thumbnail Ideas</h3>
<input id="ttopic" placeholder="Video topic likho...">
<button id="b1">Generate Ideas</button>
<pre id="outThumb">Yahan ideas aayenge...</pre>
</div>

<div class="card" id="t2" style="display:none">
<h3>YouTube Hashtag Creator</h3>
<input id="htopic" placeholder="Video topic likho...">
<button id="b2">Generate Hashtags</button>
<pre id="outHash">Yahan hashtags aayenge...</pre>
</div>

<script>
document.getElementById('tab0').onclick=function(){show(0)};
document.getElementById('tab1').onclick=function(){show(1)};
document.getElementById('tab2').onclick=function(){show(2)};
function show(n){
for(let i=0;i<3;i++){
document.getElementById('t'+i).style.display=i===n?'block':'none';
document.getElementById('tab'+i).className='tab'+(i===n?' active':'');
}
}
document.getElementById('b0').onclick=function(){
let t=document.getElementById('topic').value.trim();
if(!t) t='My Video';
document.getElementById('outScript').innerText="HOOK (0-10s):\nStop! "+t+" ke baare me ye 3 baatein koi nahi batayega.\n\nINTRO:\nAssalam o Alaikum dosto, welcome to ScoreLab AI Tools.\n\nMAIN POINTS:\n1. "+t+" kya hai?\n2. Iske 3 faide\n3. Mera honest opinion\n\nCTA:\nVideo pasand aaye to Like Subscribe zaroor karna.";
};
document.getElementById('b1').onclick=function(){
let t=document.getElementById('ttopic').value.trim()||'Video';
document.getElementById('outThumb').innerText="1. "+t.toUpperCase()+" 😱 | Red Arrow + Shocked Face\n2. Before vs After - "+t+"\n3. 3 Secrets of "+t+"\n4. I Tried "+t+" - Shocking Result\n5. Big ? + "+t+" Photo (Yellow text)";
};
document.getElementById('b2').onclick=function(){
let raw=document.getElementById('htopic').value.trim().toLowerCase()||'video';
let t=raw.replace(/[^a-z0-9]/g,'');
document.getElementById('outHash').innerText="#"+t+" #youtubepk #viralvideo #"+t+"2026 #trending #scorelab #foryou #pakistanyoutuber";
};
show(0);
</script>
</body>
</html>
